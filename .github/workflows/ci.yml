name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        # Needed by the real-browser adapter tests and the smoke below.
        # GitHub's ubuntu runner sets CI=true, so Cairntrace applies
        # --no-sandbox / --disable-dev-shm-usage automatically.
        run: bunx playwright install --with-deps chromium

      - name: Verify (production audit + typecheck + lint + format + knip + test)
        run: bun run verify

      - name: Smoke — run specs end-to-end against real Chromium
        # examples/cairntrace.config.yml owns the whole lifecycle: docker
        # compose (Postgres on :5433), the conditional seed, and the demo
        # server via webServer. CI=true makes every phase start fresh.
        run: |
          set -euo pipefail
          ./bin/cairn run \
            examples/flows/01-dashboard-nav.yml \
            examples/flows/08-conditional-step.yml \
            examples/flows/13-widgets-form.yml \
            examples/flows/platform/20-login-journey.yml \
            examples/flows/platform/24-documents-pdf.yml \
            examples/flows/platform/26-exports.yml \
            examples/flows/platform/27-api-session.yml \
            examples/flows/platform/30-restock-job.yml \
            examples/flows/platform/31-run-step-teardown.yml \
            examples/flows/platform/32-api-login-v2.yml \
            examples/flows/platform/33-export-workbook.yml \
            --backend playwright

  desktop:
    name: desktop app (tests + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install root dependencies
        # Studio tests run the repo's bin/cairn (--help parity checks), which
        # needs the CLI's own dependencies.
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        # The Electron binary itself is not needed to run the node:test suite
        # or tsc; skipping the download keeps this job under a minute.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: cd desktop && bun install --frozen-lockfile

      - name: Test the desktop core (node:test)
        run: cd desktop && bun run test

      - name: Typecheck the desktop main process
        run: cd desktop && bun run typecheck
      # The boot harness (`bun run desktop:smoke`) needs a display and the
      # Electron binary; run it locally before shipping, not in CI.

  export-playwright:
    name: exported Playwright project (typecheck + run)
    runs-on: ubuntu-latest
    # Browser-heavy like the smoke above: serialized after `verify` instead of
    # competing with it for the shared runner pool.
    needs: verify
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Export examples/flows as a Playwright project
        # The generated package.json pins @playwright/test/typescript/@types/node;
        # the repo's node_modules already provides them, so link instead of a
        # second network install.
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/cairn-playwright-export"
          ./bin/cairn export playwright examples/flows --project --out-dir "$EXPORT_DIR" --format json > "$RUNNER_TEMP/export-report.json"
          test -f "$EXPORT_DIR/.cairn-export.json"
          if grep -rIliE '__CAIRN_[A-Z_]+__' "$EXPORT_DIR"; then
            echo "late-bound sentinel leaked into the export" >&2
            exit 1
          fi
          ln -s "$GITHUB_WORKSPACE/node_modules" "$EXPORT_DIR/node_modules"
          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"

      - name: Check the export is fresh (manifest drift detection)
        # Regenerates in memory from the manifest's recorded input and diffs it
        # against disk: exit 0 fresh, 1 stale, 2 error.
        run: ./bin/cairn export playwright --check "$EXPORT_DIR" --format json

      - name: Typecheck the export (strict + noUnusedLocals)
        run: cd "$EXPORT_DIR" && ./node_modules/.bin/tsc --noEmit -p . --noUnusedLocals

      - name: Export the host-command modes (inline, global, manifest) and typecheck them
        # E10: run: steps / teardown / capture through the bounded helper
        # (inline), the global-setup with cairn wait + fixtures (global, with
        # node / datasource verifiers gated), and the manifest listing. Each
        # is checked fresh and compiled strictly; inline is also RUN below.
        run: |
          set -euo pipefail
          for mode in inline global manifest; do
            dir="$RUNNER_TEMP/cairn-playwright-export-$mode"
            extra=""
            if [ "$mode" = "global" ]; then extra="--verifiers gate --gate-env MONGO_URI"; fi
            ./bin/cairn export playwright examples/flows --project --out-dir "$dir" --preconditions "$mode" $extra --format json > "$RUNNER_TEMP/export-report-$mode.json"
            if grep -rIliE '__CAIRN_[A-Z_]+__' "$dir"; then
              echo "late-bound sentinel leaked into the $mode export" >&2
              exit 1
            fi
            ln -s "$GITHUB_WORKSPACE/node_modules" "$dir/node_modules"
            ./bin/cairn export playwright --check "$dir" --format json
            (cd "$dir" && ./node_modules/.bin/tsc --noEmit -p . --noUnusedLocals)
          done
          test -f "$RUNNER_TEMP/cairn-playwright-export-global/global-setup.ts"
          grep -q '"preconditions"' "$RUNNER_TEMP/cairn-playwright-export-manifest/.cairn-export.json"
          echo "EXPORT_INLINE_DIR=$RUNNER_TEMP/cairn-playwright-export-inline" >> "$GITHUB_ENV"

      - name: Export the config's `demo` target profile and typecheck it
        # export.targets.demo (examples/cairntrace.config.yml) carries the
        # flags of one handoff (input, env, inline, gated verifiers); the
        # manifest records the target and --check regenerates it.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cairn-playwright-export-target"
          ./bin/cairn export playwright --config examples/cairntrace.config.yml --target demo --project --out-dir "$dir" --format json > "$RUNNER_TEMP/export-report-target.json"
          grep -q '"target": "demo"' "$dir/.cairn-export.json"
          if grep -rIliE '__CAIRN_[A-Z_]+__' "$dir"; then
            echo "late-bound sentinel leaked into the target export" >&2
            exit 1
          fi
          ln -s "$GITHUB_WORKSPACE/node_modules" "$dir/node_modules"
          ./bin/cairn export playwright --check "$dir" --format json
          (cd "$dir" && ./node_modules/.bin/tsc --noEmit -p . --noUnusedLocals)

      - name: Verify the exports (static gates)
        # E5: sentinels, tsc with the export's tsconfig, `playwright test --list`
        # == exported specs and freshness, for the default export and each
        # host-command mode. Exit 0 means no gate failed; the eslint gate is
        # skipped (the generated project has no eslint config), which is not a
        # pass and not a failure here. The differential / mutation runs need
        # the demo app and stay a local step (`--verify --differential`).
        run: |
          set -euo pipefail
          ./bin/cairn export playwright --verify "$EXPORT_DIR" --format json > "$RUNNER_TEMP/verify-report.json"
          for mode in inline global manifest target; do
            ./bin/cairn export playwright --verify "$RUNNER_TEMP/cairn-playwright-export-$mode" --format json > /dev/null
          done

      - name: Start the demo platform (Postgres + seeded demo app)
        # server.ts seeds (and migrates) on start, so it must come up after
        # Postgres is healthy.
        run: |
          set -euo pipefail
          docker compose -f examples/docker-compose.yaml up -d --wait
          nohup bun examples/demo-app/server.ts > "$RUNNER_TEMP/demo-app.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:8787/api/health | grep -q '"database":"up"'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/demo-app.log"
          exit 1

      - name: Run the inline host-command export against the demo app
        # Runs FIRST: its teardown leaves the catalog as it found it, while
        # the default export (no teardown) leaves a product behind for the next
        # run. --preconditions inline: the run: step provisions a product and the
        # teardown deletes it again, through the bounded helper; captures read
        # the page through the in-page probe. (The global variant would keep
        # its fixture alive for the whole suite and skew the catalog counts, so
        # it is compiled above, not run.)
        run: |
          set -euo pipefail
          cd "$EXPORT_INLINE_DIR"
          ./node_modules/.bin/playwright test

      - name: Run the exported suite against the demo app
        # test.fixme tests (specs that need a run: step or config fixtures, which
        # only --preconditions inline|global export) report as skipped.
        run: |
          set -euo pipefail
          cd "$EXPORT_DIR"
          ./node_modules/.bin/playwright test --list
          ./node_modules/.bin/playwright test

      - name: Demo app log
        if: failure()
        run: cat "$RUNNER_TEMP/demo-app.log" || true
